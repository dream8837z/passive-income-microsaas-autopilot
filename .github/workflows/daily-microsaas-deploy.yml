name: Daily Micro-SaaS & Passive Income pSEO Sync & Deploy

on:
  push:
    branches:
      - main
  schedule:
    # 매일 새벽 04:30 KST (19:30 UTC) 무인 환율 동기화 · 113페이지 빌드 · SEO 감사 · 자동 배포
    - cron: "30 19 * * *"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  build-and-audit:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Run unit & integration tests
        run: python3 -m unittest discover -s tests -v

      - name: Fetch live FX, build 113-page Micro-SaaS & pSEO site, run SEO audit
        env:
          DRY_RUN: "false"
          SITE_URL: "https://dream8837z.github.io/passive-income-microsaas-autopilot"
          ADSENSE_CLIENT_ID: ${{ secrets.ADSENSE_CLIENT_ID || 'ca-pub-9014872001634608' }}
        run: python3 -m microsaas_engine run

      - name: Upload GitHub Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy-pages:
    needs: build-and-audit
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
